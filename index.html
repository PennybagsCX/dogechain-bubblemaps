
<!DOCTYPE html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- REMOVED: CSP is now set via HTTP headers in vercel.json -->
    <!-- This eliminates conflicts and ensures consistent policy enforcement -->

    <!-- SECURITY: Additional Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <!-- Note: frame-ancestors and X-Frame-Options must be set via server headers, not meta tags -->

    <meta name="description" content="DogeOS Bubblemaps: interactive on-chain intelligence for the DogeOS Chikyū testnet. Visualize token distributions, track holders, and explore wallet connections." />
    <meta name="keywords" content="DogeOS, Chikyū, Testnet, Blockchain, Bubble Map, Crypto Visualization, Holder Tracker, Analytics" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/favicon.svg">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/" />
    <meta property="og:title" content="DogeOS Bubblemaps - On-Chain Intelligence" />
    <meta property="og:description" content="Visualize token distributions, track whales, and analyze wallet connections with AI-powered insights." />
    <meta property="og:image" content="https://www.dogechain-bubblemaps.xyz/og-preview.png" />
    <meta property="og:image:alt" content="DogeOS Bubblemaps - Interactive on-chain intelligence platform" />
    <!-- Optional: Facebook App ID (not required for sharing, add if you create a Facebook app) -->
    <!-- <meta property="fb:app_id" content="" /> -->

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="/" />
    <meta property="twitter:title" content="DogeOS Bubblemaps" />
    <meta property="twitter:description" content="Interactive on-chain intelligence for the DogeOS Chikyū testnet. Track holders and visualize token distribution." />
    <meta property="twitter:image" content="https://www.dogechain-bubblemaps.xyz/twitter-preview.png" />
    <meta property="twitter:image:alt" content="DogeOS Bubblemaps - Interactive on-chain intelligence platform" />

    <meta name="theme-color" content="#0B0D17" />
    <title>DogeOS Bubblemaps - On-Chain Intelligence & Visualization</title>

    <!-- Using system fonts to avoid SSL issues on Arc iOS -->
    <link rel="stylesheet" href="/index.css">

    <!-- Custom animations -->
    <style>
      @keyframes pulse-green-glow {
        0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); opacity: 1; }
        50% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); opacity: 0.8; }
      }
      .live-badge-pulse { animation: pulse-green-glow 2s ease-in-out infinite; }
    </style>
</head>
